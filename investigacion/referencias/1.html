    <!-- Google Analytics (GA4). Sits outside the SEO markers so every
         prerendered route keeps it; client-side route changes are picked up
         by GA4's enhanced measurement (history-change page views).

         GA now loads ONLY after the visitor accepts analytics cookies in the
         cookie banner (src/components/CookieBanner.jsx). Until then this
         script defines a gtag() stub and window.yaasAnalytics and nothing
         else: no request to googletagmanager.com or google-analytics.com, no
         _ga* cookies, no page_view. The banner calls
         window.yaasAnalytics.enable() on "Cool, got it" and .disable() on
         "No thanks" (which also expires any _ga* cookies already set).

         A returning visitor who accepted earlier (localStorage key
         `yaas-cookie-consent`) gets gtag.js loaded from here, once the page
         has finished loading and the browser is idle (the 175 KiB library is
         not requested earlier: as an async <script> in the head it competed
         with the app bundle for bandwidth and ran ~230-280ms of main-thread
         work in the middle of the hero's start-up, PageSpeed mobile TBT).
         Global Privacy Control (navigator.globalPrivacyControl) counts as
         "No thanks": GA is never loaded for that visitor. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var ID = 'G-L97RMT0WBK';
        var enabled = false;
        var injected = false;

        function enable() {
          if (enabled) return;
          enabled = true;
          window['ga-disable-' + ID] = false;
          gtag('js', new Date());
          gtag('config', ID);
          if (injected) return;
          injected = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
          document.head.appendChild(s);
        }

        // Deletes by name pattern only (_ga, _ga_*); values are never read.
        // GA sets its cookies on the registrable domain, so every parent
        // domain of the host is tried, as well as the host itself.
        function disable() {
          enabled = false;
          window['ga-disable-' + ID] = true;
          var names = [];
          document.cookie.split(';').forEach(function (pair) {
            var name = pair.split('=')[0].replace(/^\s+|\s+$/g, '');
            if (name === '_ga' || name.indexOf('_ga_') === 0) names.push(name);
          });
          if (!names.length) return;
          var labels = location.hostname.split('.');
          var domains = [''];
          for (var i = 0; i < labels.length - 1; i++) domains.push('; domain=' + labels.slice(i).join('.'));
          names.forEach(function (name) {
            domains.forEach(function (domain) {
              document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + domain;
            });
          });
        }

        window.yaasAnalytics = { enable: enable, disable: disable };

        var granted = false;
        try {
          var stored = JSON.parse(localStorage.getItem('yaas-cookie-consent'));
          granted = !!stored && stored.analytics === 'granted';
        } catch (e) {}
        if (!granted || navigator.globalPrivacyControl === true) return;

        function schedule() {
          if ('requestIdleCallback' in window) requestIdleCallback(enable, { timeout: 5000 });
          else setTimeout(enable, 3000);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>

    <!-- Both self-hosted faces are preloaded. Without this, Bounded only starts
         downloading once the CSS has been parsed and something needs it, so it
         swaps in later than it has to; font-display: swap (styles/index.css)
         already means nothing is render-blocked on either of them. -->
    <link rel="preload" href="/fonts/Soledago.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Bounded-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The can model, 147KB, is the last link in a four-deep chain the browser
         can only discover by running it: index.js has to load and execute
         before HomePage.js is asked for, which brings in Scene.js, which brings
         in the chunk that finally calls useGLTF. Measured on PageSpeed, the
         model did not start downloading until 1-2.5s in. The preload takes it
         off that chain — it starts with the first bytes of the document and
         downloads alongside the JS instead of after it.
         `as="fetch"` with an anonymous crossorigin is what three's own
         FileLoader ends up requesting, so the two match and the browser serves
         the loader from this response rather than fetching the file twice
         (checked in the network log: one request, not two).

         The media query is not a formality. Preloading 147KB puts it in front
         of the JS that actually paints the page, and on a phone's bandwidth
         that is a straight loss: measured unconditionally, mobile LCP went
         2330ms -> 3155ms and the score dropped 4 points, and fetchpriority="low"
         did not buy it back. A preload only pays for itself where there is
         bandwidth to spare, so it is asked for at the widths where the model
         is also drawn largest. Below 1024 the link does not match, nothing is
         preloaded, and the loader fetches the model exactly as it did before
         (verified: same ~175ms start as with no preload at all). -->
    <link rel="preload" href="/models/can.glb" as="fetch" crossorigin media="(min-width: 1024px)" />
    <!-- Image preloads that depend on the route. They used to be static <link>s
         here, but every route's HTML is a copy of this file, so the homepage's
         hero stills (~250KB) were being fetched on every flavor page, where
         nothing uses them, and the flavor page's own LCP image was not preloaded
         at all.
         - Homepage: the hero stills (LazyScene.jsx), by composition (<=959
           mobile, >=1200 desktop; 960-1199 starts the Canvas at once). They are
           the LCP candidate where WebGL has no GPU behind it and were only
           requested once index.js had run and React had rendered them (measured
           on a throttled phone: ~4s in, mobile LCP ~4.8s).
         - Flavor pages: the full-bleed grain texture of the story section's
           background (.background-texture). It is the LCP element there, a CSS
           background that the browser only finds after the stylesheet is applied
           and React has rendered the section (~1s in on a phone; LCP 5.5s). -->
    <script>
      (function () {
        var B = '/', p = location.pathname.replace(/index.html$/, ''), urls = [], m;
        if (p === B) {
          m = innerWidth <= 959 ? 'mobile' : innerWidth >= 1200 ? 'desktop' : '';
          if (m) ['strawberry', 'blueberry', 'orange'].forEach(function (id) { urls.push(B + 'images/hero/poster-' + m + '-' + id + '.webp'); });
        } else if (p.indexOf(B + 'flavors/') === 0) {
          urls.push(B + 'textures/bg-texture.webp');
        }
        urls.forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.href = href; l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      })();
    </script>
    <!-- The two @font-face rules live here rather than in styles/index.css, and
         for the same reason the preloads above do: / is substituted at
         build time, so one source works whether the build is served from the
         root or from a sub-path.

         Vite does NOT rebase a root-absolute url() inside CSS, which is what
         made this necessary — styles/index.css had '/yaas/fonts/...' hardcoded
         to make the Pages build work, and that 404'd on every other origin
         including the dev server, so the real faces silently never loaded and
         everything fell back to Arial Narrow / Helvetica. A relative url()
         would be rebased, but these files are in public/ and so have no path
         to be relative to.

         font-display: swap, as before: nothing is render-blocked on either. -->
    <style>
      @font-face {
        font-family: 'Soledago';
        /* WOFF2 first (28.8 KiB, brotli-compressed) — same outlines as the
           original TTF (114.8 KiB), just repackaged; the .ttf stays in
           public/fonts/ purely as a format fallback for the handful of
           browsers that don't support WOFF2 (none of this project's actual
           targets), never fetched otherwise since the browser picks the
           first src it can use. */
        src:
          url('/fonts/Soledago.woff2') format('woff2'),
          url('/fonts/Soledago.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Replaces Beiruti site-wide — see --font-beiruti in styles/index.css.
         Name kept as 'Bounded' (not 'Beiruti') so it's obvious at a glance
         which family is actually loaded when reading font stacks elsewhere. */
      @font-face {
        font-family: 'Bounded';
        /* WOFF2 first (78.8 KiB vs the original .otf's 151 KiB) — same
           fallback reasoning as Soledago above. */
        src:
          url('/fonts/Bounded-Medium.woff2') format('woff2'),
          url('/fonts/Bounded-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      /* Same reasoning as the faces above, for the one image referenced from a
         CSS url() rather than from JS: a custom property can carry a
         base-resolved url() into any stylesheet, which / cannot reach
         on its own. Used by .background-texture (styles/index.css) and
         .screen2-bg-texture (styles/screen2.css). Assets referenced from JS go
         through data/assetUrl.js instead and were never affected. */
      :root {
        --asset-bg-texture: url('/textures/bg-texture.webp');
      }
    </style>
